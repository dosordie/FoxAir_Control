name: CI

on:
  pull_request:
    branches:
      - work
      - main
  push:
    branches:
      - work
      - main
      - 'codex/**'

jobs:
  compile:
    name: Compile on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all Python files
        run: python -m compileall .

      - name: Compile main entry points
        shell: pwsh
        run: |
          $files = @(
            'foxair_phnix_control.py',
            'cloud/warmlink_api.py',
            'workers/warmlink_cloud_worker.py',
            'dialogs/cloud_dialog.py'
          )

          foreach ($file in $files) {
            if (Test-Path $file) {
              python -m py_compile $file
            } else {
              Write-Host "Optional compile target not found: $file"
            }
          }

  test:
    name: Semantic and UI regression tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'PySide6==6.8.3' 'pytest>=8,<9'
      - name: Run new integration tests
        run: python -m pytest -q tests/test_ios308_registers_and_codes.py tests/test_ios308_debugger_and_sim.py tests/test_warmlink_service_main_table.py
      - name: Run all tests
        run: timeout 300 python -m pytest -v -s -o faulthandler_timeout=120
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Check whitespace
        run: git diff --check origin/work...HEAD
